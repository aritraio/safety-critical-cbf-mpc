# Vehicle inertial + geometric parameters (mid-size sedan, cf. Rajamani).
mass: 1500.0              # [kg] total vehicle mass m
yaw_inertia: 2500.0       # [kg m^2] yaw moment of inertia Iz
wheelbase_front: 1.2      # [m] distance CG -> front axle (lf)
wheelbase_rear: 1.3       # [m] distance CG -> rear axle (lr)
track_width: 1.6          # [m] (visualization / load transfer only)
wheel_radius: 0.33        # [m]
gravity: 9.81             # [m/s^2]

# Pacejka Magic Formula (lateral, per-tire) at nominal friction.
# Fy = D*sin(C*atan(B*a - E*(B*a - atan(B*a))))
pacejka:
  B: 10.0
  C: 1.3
  D: 3500.0               # [N] peak lateral force per tire at mu_nominal
  E: -1.0
mu_nominal: 0.9
drive_bias_front: 0.0     # 0 = RWD, 0.5 = AWD, 1 = FWD

# Actuator limits + numerics
steer_max: 0.55           # [rad] ~31.5 deg
steer_rate_max: 3.0       # [rad/s] (enforced in Phase 3 rate constraints)
accel_max: 3.0            # [m/s^2]
accel_min: -6.0           # [m/s^2] braking
accel_rate_max: 8.0       # [m/s^3] longitudinal slew limit (soft-CBF QP)
vx_epsilon: 1.0           # [m/s] low-speed clamp for slip-angle atan (max(.,eps))
operating_speed: 20.0     # [m/s] (~72 km/h) linearization point for LQR
