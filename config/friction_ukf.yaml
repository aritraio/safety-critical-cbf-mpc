# Adaptive friction UKF tuning (state [vx, vy, r, mu], meas [ax, ay, r, vx]).
# Q/R/P0 are per-step discrete (co)variances. mu random-walk Q_mu is small on
# purpose: mu moves through measurement updates (ay sensitivity), Q only keeps
# the covariance from collapsing during unexcited cruising.
van_der_merwe:
  alpha: 0.001
  beta: 2.0
  kappa: 0.0

mu_init: 0.9
mu_min: 0.1
mu_max: 1.3
R_prior: 1.0   # mean-reversion variance toward mu_nominal (<= 0 disables)

Q_diag: [1.0e-4, 1.0e-4, 1.0e-6, 1.0e-8]   # vx, vy, r, mu
R_diag: [0.09, 0.09, 1.0e-6, 0.0025]      # ax_imu, ay_imu, r_imu, vx_wheels
P0_diag: [1.0, 1.0, 0.1, 0.25]
